name: Auto Merge IPTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Sources
        run: |
          curl -L "https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u" -o one.m3u
          curl -L "https://raw.githubusercontent.com/ahan443/FAST-IPTV/refs/heads/main/combined_playlist.m3u" -o two.m3u
          curl -L "https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/refs/heads/main/LiveTV/Bangladesh/LiveTV.m3u" -o three.m3u
          curl -L "https://raw.githubusercontent.com/sm-monirulislam/SM-Live-TV/refs/heads/main/Combined_Live_TV.m3u" -o four.m3u

      - name: Process and Merge Playlists
        run: |
          # ১. সব প্লেলিস্ট এক ফাইলে যুক্ত করা
          cat one.m3u two.m3u three.m3u four.m3u > temp_raw.m3u

          # ২. ডুপ্লিকেট লিঙ্ক ফিল্টার করা (একই লিঙ্ক একবারের বেশি আসবে না)
          awk '
            BEGIN { RS = "#EXTINF"; FS = "\n" }
            NR > 1 {
              extinf = $1
              url = ""
              for (i = 2; i <= NF; i++) {
                if ($i !~ /^#/ && $i != "") {
                  url = $i
                  break
                }
              }
              if (url != "" && !seen[url]++) {
                print "#EXTINF" extinf "\n" url
              }
            }
          ' temp_raw.m3u > temp_channels.m3u

          # ৩. মোট চ্যানেল সংখ্যা হিসাব করা
          COUNT=$(grep -c "^#EXTINF" temp_channels.m3u || echo 0)

          # ৪. বাংলাদেশ সময় (UTC+6) অনুযায়ী টাইমস্ট্যাম্প
          BD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %H:%M:%S (BD Time)')

          # ৫. চূড়ান্ত ফাইল তৈরি ও হেডার বসানো
          cat << 'EOF' > BDIX-Playlist.m3u
