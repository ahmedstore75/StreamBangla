name: Auto Merge IPTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Merge Script
        run: python merge.py

      - name: Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add BDIX-Playlist.m3u BDIX-Movies.m3u BDIX-Radio.m3u
          git commit -m "🤖 [Auto-Update] Split TV, Movies & Radio playlists 🔄⚡" || exit 0
          git push
