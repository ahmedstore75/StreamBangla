name: Auto Merge IPTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Sources
        run: |
          curl -L "https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u" -o one.m3u
          curl -L "https://raw.githubusercontent.com/ahan443/FAST-IPTV/refs/heads/main/combined_playlist.m3u" -o two.m3u
          curl -L "https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/refs/heads/main/LiveTV/Bangladesh/LiveTV.m3u" -o three.m3u
          curl -L "https://raw.githubusercontent.com/sm-monirulislam/SM-Live-TV/refs/heads/main/Combined_Live_TV.m3u" -o four.m3u

      - name: Merge and Generate Header with Dynamic Counts
        run: |
          cat one.m3u two.m3u three.m3u four.m3u > temp_raw.m3u

          python3 - << 'EOF'
          import datetime

          with open("temp_raw.m3u", "r", encoding="utf-8", errors="ignore") as f:
              lines = [line.strip() for line in f if line.strip()]

          seen_urls = set()
          channel_entries = []

          i = 0
          while i < len(lines):
              line = lines[i]

              if line.startswith("#EXTINF"):
                  extinf_line = line
                  i += 1
                  
                  # অতিরিক্ত কমেন্ট বা ট্যাগ স্কিপ করা
                  while i < len(lines) and lines[i].startswith("#"):
                      i += 1

                  if i < len(lines):
                      stream_url = lines[i]
                      # শুধুমাত্র ১ম বার পাওয়া লিঙ্কটি রাখা হবে
                      if stream_url not in seen_urls:
                          seen_urls.add(stream_url)
                          channel_entries.append((extinf_line, stream_url))
              
              elif not line.startswith("#"):
                  if line not in seen_urls:
                      seen_urls.add(line)
                      channel_entries.append((None, line))
              
              i += 1

          # চ্যানেলের সঠিক মোট সংখ্যা
          total_channels = len(channel_entries)

          # বাংলাদেশ সময় (UTC+6) অনুযায়ী আপডেট টাইম
          bd_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=6)))
          updated_time_str = bd_time.strftime("%Y-%m-%d %H:%M:%S (BD Time)")

          # হেডার তৈরি
