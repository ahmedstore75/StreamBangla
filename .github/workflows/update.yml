xml.gz, https://epgshare01.online/epgshare01/epg_ripper_VN1.xml.gz, https://epgshare01.online/epgshare01/epg_ripper_VOA1.xml.gz, https://epgshare01.online/epgshare01/epg_ripper_ZA1.xml.gz, https://epgshare01.online/epgshare01/epg_ripper_viva-russia.ru.xml.gz"

#=================================
# 🖥️ Developed by: Ahammad Ali
# 🔗 Telegram: https://t.me/banglatvlivefree
# 🕒 Last Updated: {updated_time_str}
# 📺 Channels Count: {total_channels}
# 🔒 Usage: Personal / Educational
#=================================\n"""

          with open("BDIX-Playlist.m3u", "w", encoding="utf-8") as f:
              f.write(header)
              for extinf, url in channel_entries:
                  if extinf:
                      f.write(extinf + "\n")
                  f.write(url + "\n")
          EOF

          rm temp_raw.m3u

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add BDIX-Playlist.m3u
          git commit -m "Auto merge, update header and channel count" || exit 0
          git push
