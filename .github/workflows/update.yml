name: Auto Merge IPTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Sources
        run: |
          curl -L "https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u" -o one.m3u
          curl -L "https://raw.githubusercontent.com/ahan443/FAST-IPTV/refs/heads/main/combined_playlist.m3u" -o two.m3u
          curl -L "https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/refs/heads/main/LiveTV/Bangladesh/LiveTV.m3u" -o three.m3u
          curl -L "https://raw.githubusercontent.com/sm-monirulislam/SM-Live-TV/refs/heads/main/Combined_Live_TV.m3u" -o four.m3u

      - name: Merge and Filter Duplicate Stream URLs
        run: |
          cat one.m3u two.m3u three.m3u four.m3u > temp_raw.m3u

          python3 - << 'EOF'
          with open("temp_raw.m3u", "r", encoding="utf-8", errors="ignore") as f:
              lines = [line.strip() for line in f if line.strip()]

          seen_urls = set()
          output_lines = ["#EXTM3U"]

          i = 0
          while i < len(lines):
              line = lines[i]

              if line.startswith("#EXTINF"):
                  extinf_line = line
                  i += 1
                  
                  # অতিরিক্ত ট্যাগ বা কমেন্ট স্কিপ করা
                  while i < len(lines) and lines[i].startswith("#"):
                      i += 1

                  if i < len(lines):
                      stream_url = lines[i]
                      # একই স্ট্রিমিং লিঙ্ক ২বার আসবে না
                      if stream_url not in seen_urls:
                          seen_urls.add(stream_url)
                          output_lines.append(extinf_line)
                          output_lines.append(stream_url)
              
              elif not line.startswith("#"):
                  if line not in seen_urls:
                      seen_urls.add(line)
                      output_lines.append(line)
              
              i += 1

          with open("BDIX-Playlist.m3u", "w", encoding="utf-8") as f:
              for line in output_lines:
                  f.write(line + "\n")
          EOF

          rm temp_raw.m3u

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add BDIX-Playlist.m3u
          git commit -m "Auto merge and filter duplicate m3u8 URLs" || exit 0
          git push
