EOF

          # ৬. ডাইনামিক ডেটা রিপ্লেস করা
          sed -i "s|__LAST_UPDATED__|$BD_TIME|g" BDIX-Playlist.m3u
          sed -i "s|__COUNT__|$COUNT|g" BDIX-Playlist.m3u

          # ৭. চ্যানেল তালিকা যুক্ত করা
          cat temp_channels.m3u >> BDIX-Playlist.m3u

          # ৮. অস্থায়ী ফাইলসমূহ মুছে ফেলা
          rm temp_raw.m3u temp_channels.m3u

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add BDIX-Playlist.m3u
          git commit -m "Auto merge, dynamic count & unique URLs" || exit 0
          git push
